name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build for Apple Silicon and Intel
        run: ./build.sh --universal
      - name: Check quota parsing and bitmap rendering
        run: |
          ./CodexQuotaBar.app/Contents/MacOS/CodexQuotaBar --self-test
          ./CodexQuotaBar.app/Contents/MacOS/CodexQuotaBar --render-check "$RUNNER_TEMP/render-check.png"
          codesign --verify --strict CodexQuotaBar.app
          lipo -info CodexQuotaBar.app/Contents/MacOS/CodexQuotaBar
      - name: Package application
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent CodexQuotaBar.app dist/CodexQuotaBar-macOS-universal.zip
          cd dist
          shasum -a 256 CodexQuotaBar-macOS-universal.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaBar-macOS-universal
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CodexQuotaBar-macOS-universal
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "CodexQuotaBar $RELEASE_TAG" --generate-notes
